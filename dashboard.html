<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanggalTua - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fef08a 0%, #fbcfe8 100%);
        }
        /* Menyembunyikan spinner input number */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-[40px] shadow-xl p-6 max-w-sm w-full h-[780px] flex flex-col justify-between border border-pink-100 relative overflow-hidden">
        
        <div class="flex-grow flex flex-col overflow-y-auto pb-4">
            
            <div class="bg-[#fbcfe8] bg-opacity-70 rounded-2xl p-4 mb-4 text-center">
                <p class="text-xs text-slate-500 font-medium">Saldo</p>
                <h3 id="balance-display" class="text-xl font-bold text-slate-800 mt-0.5">Rp 0</h3>
            </div>

            <div id="menu-transaksi-container" class="space-y-4 flex-grow flex flex-col">
                
                <div id="sub-layar-histori" class="space-y-4 flex-grow flex flex-col">
                    <div class="bg-[#fbcfe8] bg-opacity-40 rounded-full py-1.5 text-center font-medium text-sm text-slate-700 shadow-sm">
                        Histori
                    </div>

                    <div class="flex justify-between items-center bg-white border border-pink-100 rounded-full px-4 py-2 text-sm text-slate-700">
                        <button id="btn-prev-date" class="text-pink-400 hover:scale-110 transition"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="current-date-display" class="font-medium">28 Mei 2026</span>
                        <button id="btn-next-date" class="text-pink-400 hover:scale-110 transition"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div id="histori-list" class="space-y-2 flex-grow overflow-y-auto max-h-[340px] pr-1">
                        <p class="text-center text-xs text-slate-400 mt-10">Belum ada transaksi hari ini.</p>
                    </div>

                    <button id="btn-buka-input" class="w-full bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-800 font-semibold py-3 rounded-full text-sm shadow-sm transition mt-auto">
                        Transaksi
                    </button>
                </div>

                <div id="sub-layar-input" class="space-y-4 hidden flex-grow flex flex-col">
                    <div class="bg-[#fbcfe8] bg-opacity-40 rounded-full p-1 flex">
                        <button id="tab-pemasukan" class="flex-1 text-center py-1.5 text-xs font-semibold rounded-full text-slate-500 transition">Pemasukan</button>
                        <button id="tab-pengeluaran" class="flex-1 bg-white text-center py-1.5 text-xs font-bold rounded-full text-slate-800 shadow-sm transition">Pengeluaran</button>
                    </div>

                    <div class="relative">
                        <input type="number" id="transaction-amount" placeholder="Masukkan Nominal..."
                            class="w-full px-5 py-3 border-2 border-[#fbcfe8] rounded-full text-sm font-medium text-center focus:outline-none focus:border-pink-300 bg-white placeholder-slate-400">
                    </div>

                    <div id="kategori-grid" class="grid grid-cols-3 gap-y-4 gap-x-2 py-2 text-center overflow-y-auto max-h-[260px]">
                        </div>

                    <div class="flex gap-3 mt-auto pt-2">
                        <button id="btn-cancel-transaksi" class="flex-1 bg-white border border-pink-200 text-slate-700 font-medium py-2.5 rounded-full text-sm transition hover:bg-slate-50">Cancel</button>
                        <button id="btn-submit-transaksi" class="flex-1 bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-800 font-semibold py-2.5 rounded-full text-sm shadow-sm transition">Submit</button>
                    </div>
                </div>

            </div>

            <div id="menu-notifikasi-container" class="space-y-4 hidden text-center pt-10">
                <i class="fa-solid fa-bell text-4xl text-pink-300"></i>
                <h4 class="font-bold text-slate-700">Notifikasi</h4>
                <p class="text-xs text-slate-400">Belum ada pemberitahuan baru.</p>
            </div>

            <div id="menu-laporan-container" class="space-y-4 hidden text-center pt-10">
                <i class="fa-solid fa-chart-simple text-4xl text-pink-300"></i>
                <h4 class="font-bold text-slate-700">Laporan Keuangan</h4>
                <p class="text-xs text-slate-400">Analisis pengeluaran Anda akan muncul di sini.</p>
            </div>

            <div id="menu-akun-container" class="space-y-4 hidden flex-col items-center pt-6">
                <i class="fa-solid fa-circle-user text-5xl text-slate-600"></i>
                <div class="text-center">
                    <h4 id="user-display-name" class="font-bold text-slate-800 text-base">Memuat...</h4>
                    <p id="user-email" class="text-xs text-slate-400"></p>
                </div>
                <button id="btn-logout" class="w-2/3 mt-4 border border-red-300 text-red-500 font-medium py-2 rounded-full text-xs hover:bg-red-50 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar Akun
                </button>
            </div>

        </div>

        <div class="border-t border-pink-50 pt-3 mt-auto flex justify-around items-center">
            <button id="nav-transaksi" class="nav-item w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md border border-pink-100 text-pink-500 text-base transition transform scale-110">
                <i class="fa-solid fa-pencil"></i>
            </button>
            <button id="nav-notifikasi" class="nav-item w-10 h-10 text-slate-400 hover:text-pink-400 text-base transition">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button id="nav-laporan" class="nav-item w-10 h-10 text-slate-400 hover:text-pink-400 text-base transition">
                <i class="fa-solid fa-chart-simple"></i>
            </button>
            <button id="nav-akun" class="nav-item w-10 h-10 text-slate-400 hover:text-pink-400 text-base transition">
                <i class="fa-solid fa-circle-user"></i>
            </button>
        </div>

    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
