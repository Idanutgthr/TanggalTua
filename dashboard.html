<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanggalTua - Dashboard Utama</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fef08a 0%, #fbcfe8 100%);
        }
        input::-webkit-outer-spin-button, 
        input::-webkit-inner-spin-button {
            -webkit-appearance: none; 
            margin: 0;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #fbcfe8;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-[40px] shadow-2xl p-6 max-w-sm w-full h-[780px] flex flex-col justify-between border border-pink-100 relative overflow-hidden">
        
        <div class="flex-grow flex flex-col overflow-y-auto custom-scroll pb-4">
            
            <div class="bg-[#fbcfe8] bg-opacity-70 rounded-3xl p-4 mb-4 text-center border border-pink-200/50 relative overflow-hidden">
                <p class="text-xs text-slate-500 font-medium tracking-wide">My Balance</p>
                <h3 id="balance-display" class="text-2xl font-black text-slate-800 mt-0.5 tracking-tight">Rp 0</h3>
                <i class="fa-solid fa-wallet text-5xl absolute -right-2 -bottom-2 opacity-10 text-slate-900 rotate-12"></i>
            </div>

            <div id="menu-transaksi-container" class="space-y-4 flex-grow flex flex-col">
                
                <div id="sub-layar-histori" class="space-y-4 flex-grow flex flex-col">
                    <div class="bg-[#fbcfe8] bg-opacity-50 rounded-full py-2 text-center font-bold text-sm text-slate-700 shadow-sm uppercase tracking-widest">
                        Histori
                    </div>

                    <div class="flex justify-between items-center bg-white border border-pink-100 rounded-full px-5 py-2.5 text-sm text-slate-700 shadow-sm">
                        <button id="btn-prev-date" class="text-pink-400 hover:scale-120 transition"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="current-date-display" class="font-bold tracking-tight">28 Mei 2026</span>
                        <button id="btn-next-date" class="text-pink-400 hover:scale-120 transition"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>

                    <div id="histori-list" class="space-y-2 flex-grow overflow-y-auto custom-scroll max-h-[340px] pr-1">
                        <p class="text-center text-xs text-slate-400 mt-16 font-medium">Memuat data histori...</p>
                    </div>

                    <button id="btn-buka-input" class="w-full bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-800 font-bold py-3.5 rounded-full text-sm tracking-wide shadow-md transition mt-auto">
                        Transaksi
                    </button>
                </div>

                <div id="sub-layar-input" class="space-y-4 hidden flex-grow flex flex-col animate-fadeIn">
                    <div class="bg-[#fbcfe8] bg-opacity-40 rounded-full p-1 flex border border-pink-200/30 shadow-inner">
                        <button id="tab-pemasukan" type="button" class="flex-1 text-center py-2 text-xs font-semibold rounded-full text-slate-500 transition">Pemasukan</button>
                        <button id="tab-pengeluaran" type="button" class="flex-1 bg-white text-center py-2 text-xs font-bold rounded-full text-slate-800 shadow-sm transition">Pengeluaran</button>
                    </div>

                    <div class="relative">
                        <input type="number" id="transaction-amount" placeholder="Masukkan Nominal..."
                            class="w-full px-6 py-3.5 border-2 border-[#fbcfe8] rounded-full text-base font-bold text-center focus:outline-none bg-white text-slate-800 shadow-sm">
                    </div>

                    <div id="kategori-grid" class="grid grid-cols-3 gap-y-4 gap-x-2 py-2 text-center overflow-y-auto custom-scroll max-h-[260px]"></div>

                    <div class="flex gap-3 mt-auto pt-2">
                        <button id="btn-cancel-transaksi" type="button" class="flex-1 bg-white border-2 border-pink-100 text-slate-700 font-semibold py-3 rounded-full text-sm">Cancel</button>
                        <button id="btn-submit-transaksi" type="button" class="flex-1 bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-800 font-bold py-3 rounded-full text-sm shadow-md">Submit</button>
                    </div>
                </div>

            </div>

            <div id="menu-notifikasi-container" class="space-y-4 hidden flex-col flex-grow animate-fadeIn">
                
                <div id="sub-disiplin-utama" class="space-y-4 w-full flex flex-col flex-grow">
                    <div class="bg-[#fbcfe8] bg-opacity-70 rounded-3xl p-4 flex justify-between items-center border border-pink-200 shadow-sm">
                        <span class="font-bold text-slate-800 text-sm">Mode Disiplin</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-mode-disiplin" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                        </label>
                    </div>

                    <div id="box-konfigurasi-disiplin" class="hidden space-y-4 flex-grow flex flex-col">
                        <div class="flex gap-2">
                            <button id="btn-get-saldo" class="bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-700 font-bold px-3 py-2 rounded-xl text-xs whitespace-nowrap shadow-sm transition">Nominal Awal</button>
                            <input type="number" id="input-nominal-awal" placeholder="Rp. 0" class="w-full border-2 border-pink-100 rounded-xl px-3 text-xs font-bold text-center bg-slate-50 focus:outline-none" readonly>
                        </div>

                        <div class="grid grid-cols-4 gap-1 bg-slate-100 p-1 rounded-xl text-[10px] font-bold border border-slate-200">
                            <button id="lvl-kustom" class="py-2 rounded-lg text-slate-600 bg-white shadow-sm">Kustom</button>
                            <button id="lvl-sulit" class="py-2 rounded-lg text-slate-600">Sulit</button>
                            <button id="lvl-sedang" class="py-2 rounded-lg text-slate-600">Sedang</button>
                            <button id="lvl-mudah" class="py-2 rounded-lg text-slate-600">Mudah</button>
                        </div>

                        <div class="flex justify-between items-center bg-[#fbcfe8] bg-opacity-30 p-3 rounded-xl border border-pink-100">
                            <span id="label-tabungan-persen" class="text-xs font-bold text-slate-700">Tabungan (10%)</span>
                            <input type="number" id="input-nilai-tabungan" class="w-1/2 bg-transparent text-right font-black text-xs text-slate-800 focus:outline-none" placeholder="Rp. 0">
                        </div>

                        <button id="btn-tambah-aturan" class="w-full bg-pink-100 hover:bg-pink-200 text-slate-700 font-bold py-2.5 rounded-full text-xs transition shadow-sm border border-pink-200/50">Tambah Aturan</button>

                        <div id="rules-list-container" class="space-y-2 flex-grow overflow-y-auto custom-scroll max-h-[180px] pr-1"></div>

                        <button id="btn-simpan-disiplin-config" class="w-full bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-800 font-bold py-3 rounded-full text-sm shadow-md transition mt-auto">Simpan</button>
                    </div>
                </div>

                <div id="sub-disiplin-rules-picker" class="space-y-4 hidden w-full flex flex-col flex-grow animate-fadeIn">
                    <div class="bg-[#fbcfe8] bg-opacity-50 rounded-full py-2 text-center font-bold text-xs text-slate-700 uppercase tracking-wider">Pilih Kategori Pengeluaran</div>
                    <div id="grid-kategori-rules" class="grid grid-cols-3 gap-2 py-1 text-center max-h-[220px] overflow-y-auto custom-scroll"></div>
                    
                    <div class="bg-[#fbcfe8] bg-opacity-40 rounded-full p-1 flex border border-pink-200/20">
                        <button id="tab-rule-perhari" class="flex-1 bg-white text-center py-1.5 text-xs font-bold rounded-full text-slate-800 shadow-sm">Perhari</button>
                        <button id="tab-rule-perbulan" class="flex-1 text-center py-1.5 text-xs font-semibold rounded-full text-slate-500">Perbulan</button>
                    </div>

                    <div class="flex justify-between items-center bg-[#fbcfe8] bg-opacity-30 p-3 rounded-xl border border-pink-100">
                        <span class="text-xs font-bold text-slate-700">Nominal Maksimal</span>
                        <input type="number" id="input-nominal-maksimal-rule" class="w-1/2 bg-white border border-pink-100 rounded-lg px-2 py-1.5 text-center font-bold text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-pink-300" placeholder="Rp. 50.000">
                    </div>

                    <div class="flex gap-3 mt-auto pt-2">
                        <button id="btn-cancel-rule" class="flex-1 bg-white border border-pink-200 text-slate-700 font-semibold py-2.5 rounded-full text-xs">Batal</button>
                        <button id="btn-save-rule" class="flex-1 bg-[#fbcfe8] text-slate-800 font-bold py-2.5 rounded-full text-xs shadow-sm">Simpan</button>
                    </div>
                </div>
            </div>

            <div id="menu-laporan-container" class="space-y-4 hidden flex-col flex-grow animate-fadeIn">
                <div class="flex justify-between items-center bg-white border border-pink-100 rounded-full px-5 py-2.5 text-sm text-slate-700 shadow-sm">
                    <button id="rep-btn-prev-month" class="text-pink-400"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="rep-month-display" class="font-bold">Mei 2026</span>
                    <button id="rep-btn-next-month" class="text-pink-400"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <div class="bg-[#fbcfe8] bg-opacity-40 rounded-2xl p-2.5 grid grid-cols-3 gap-1.5 text-center text-[10px] border border-pink-200/30 shadow-inner">
                    <div class="bg-white rounded-xl p-2 shadow-sm flex flex-col justify-center">
                        <p class="text-slate-400 font-bold uppercase text-[9px]">Pemasukan</p>
                        <p id="rep-total-income" class="font-bold text-green-600 mt-0.5 truncate">Rp 0</p>
                    </div>
                    <div class="bg-white rounded-xl p-2 shadow-sm border border-pink-300 flex flex-col justify-center">
                        <p class="text-slate-400 font-bold uppercase text-[9px]">Tabungan</p>
                        <p id="rep-total-saving" class="font-bold text-pink-500 mt-0.5 truncate">Rp 0</p>
                    </div>
                    <div class="bg-white rounded-xl p-2 shadow-sm flex flex-col justify-center">
                        <p class="text-slate-400 font-bold uppercase text-[9px]">Pengeluaran</p>
                        <p id="rep-total-expense" class="font-bold text-slate-700 mt-0.5 truncate">Rp 0</p>
                    </div>
                </div>

                <div class="flex justify-between items-center bg-white border border-pink-100 rounded-full px-4 py-2 text-xs font-bold text-slate-700 shadow-sm">
                    <button id="rep-btn-prev-type" class="text-pink-400"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="rep-type-display" class="uppercase tracking-widest text-slate-800 text-[11px]">Pengeluaran</span>
                    <button id="rep-btn-next-type" class="text-pink-400"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <div class="bg-[#fbcfe8] bg-opacity-20 rounded-[32px] p-4 flex items-center justify-center min-h-[210px] max-h-[210px] relative border border-pink-100/40 shadow-inner">
                    <canvas id="financialChart" class="max-w-full max-h-[190px]"></canvas>
                </div>
                <div id="rep-data-list" class="space-y-2 flex-grow overflow-y-auto custom-scroll max-h-[170px] pr-1"></div>
            </div>

            <div id="menu-akun-container" class="space-y-4 hidden flex-col items-center pt-4 text-center animate-fadeIn">
                
                <div class="relative w-24 h-24 mx-auto">
                    <div class="w-24 h-24 rounded-full bg-[#fbcfe8] bg-opacity-60 flex items-center justify-center shadow-md overflow-hidden border-2 border-white">
                        <img id="img-user-avatar" class="hidden w-full h-full object-cover" src="">
                        <i id="icon-user-default" class="fa-solid fa-user text-4xl text-slate-700"></i>
                    </div>
                    <label for="input-file-avatar" class="absolute bottom-0 right-0 w-8 h-8 bg-white border border-slate-200 rounded-full flex items-center justify-center cursor-pointer shadow-md hover:scale-110 transition">
                        <i class="fa-solid fa-camera text-xs text-slate-600"></i>
                        <input type="file" id="input-file-avatar" class="hidden" accept="image/*">
                    </label>
                </div>

                <div class="flex flex-col items-center w-full">
                    <div class="flex items-center gap-2 justify-center">
                        <h4 id="user-display-name" class="font-bold text-slate-800 text-lg tracking-tight">Memuat Nama...</h4>
                        <button id="btn-edit-name" class="text-slate-400 hover:text-pink-500 text-sm transition"><i class="fa-solid fa-pencil"></i></button>
                    </div>
                    <p id="user-email" class="text-xs text-slate-400 font-medium"></p>
                </div>

                <div class="w-full bg-slate-50/80 border border-pink-100 rounded-2xl p-4 text-left shadow-sm">
                    <div class="flex items-center gap-2 text-pink-500 mb-1">
                        <i class="fa-solid fa-piggy-bank text-sm"></i>
                        <span class="text-[11px] font-bold tracking-wider uppercase">Tabungan Saya</span>
                    </div>
                    <h3 id="profile-saving-display" class="text-xl font-black text-slate-800">Rp 0</h3>
                </div>

                <div class="w-full space-y-2">
                    <div class="w-full">
                        <button id="dropdown-lang-btn" class="w-full bg-pink-50/60 border border-pink-100 px-4 py-3 rounded-xl text-xs font-bold text-slate-700 flex justify-between items-center shadow-sm">
                            <span>Tabungan</span><i class="fa-solid fa-chevron-right text-pink-300 text-[10px]"></i>
                        </button>
                    </div>
                    <div class="w-full">
                        <button id="dropdown-lang-btn" class="w-full bg-pink-50/60 border border-pink-100 px-4 py-3 rounded-xl text-xs font-bold text-slate-700 flex justify-between items-center shadow-sm">
                            <span>Bahasa</span><span class="text-pink-400 font-normal text-[11px]">Bahasa Indonesia <i class="fa-solid fa-check text-[10px]"></i></span>
                        </button>
                    </div>
                    <div class="w-full">
                        <button id="dropdown-theme-btn" class="w-full bg-pink-50/60 border border-pink-100 px-4 py-3 rounded-xl text-xs font-bold text-slate-700 flex justify-between items-center shadow-sm">
                            <span>Mode layar</span><span class="text-pink-400 font-normal text-[11px]">Terang <i class="fa-solid fa-check text-[10px]"></i></span>
                        </button>
                    </div>
                </div>

                <div class="w-full border-t border-slate-100 pt-2">
                    <button id="btn-logout" class="w-full bg-rose-50/50 border border-rose-100 text-rose-500 font-bold py-3 rounded-full text-xs hover:bg-rose-100/50 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Log out
                    </button>
                </div>
            </div>

        </div>

        <div class="border-t border-pink-100/60 pt-3 mt-auto flex justify-around items-center bg-white/80 backdrop-blur-sm">
            <button id="nav-transaksi" type="button" class="nav-item w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md border border-pink-100 text-pink-500 text-base transition transform scale-110"><i class="fa-solid fa-pencil"></i></button>
            <button id="nav-notifikasi" type="button" class="nav-item w-10 h-10 text-slate-400 hover:text-pink-400 text-base transition"><i class="fa-solid fa-bell"></i></button>
            <button id="nav-laporan" type="button" class="nav-item w-10 h-10 text-slate-400 hover:text-pink-400 text-base transition"><i class="fa-solid fa-chart-simple"></i></button>
            <button id="nav-akun" type="button" class="nav-item w-10 h-10 text-slate-400 hover:text-pink-400 text-base transition"><i class="fa-solid fa-circle-user"></i></button>
        </div>

    </div>

</body>
</html>
