<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanggalTua - Manajemen Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fef08a 0%, #fbcfe8 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-[40px] shadow-xl p-8 max-w-sm w-full min-h-[780px] flex flex-col items-center justify-between border border-pink-100">
        
        <div id="auth-container" class="w-full flex flex-col items-center flex-grow justify-center space-y-6">
            
            <div class="w-40 h-40 rounded-full bg-[#fbcfe8] bg-opacity-60 flex items-center justify-center overflow-hidden relative mb-2">
                <svg class="w-32 h-32 text-slate-700 mt-6" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>

            <div class="text-center space-y-2">
                <h2 id="auth-title" class="text-2xl font-semibold text-slate-800 leading-tight">
                    Selamat Datang di<br><span class="font-bold">Tanggal Tua</span>
                </h2>
                <p id="auth-subtitle" class="text-xs text-slate-500 font-medium max-w-[250px] mx-auto leading-relaxed">
                    kelola keuangan dengan mudah dan lebih hemat
                </p>
            </div>

            <form id="auth-form" class="w-full space-y-4 pt-2">
                
                <div id="wrapper-name" class="hidden">
                    <input type="text" id="reg-name"
                        class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300 transition" 
                        placeholder="Nama Lengkap">
                </div>

                <div>
                    <input type="email" id="email" required
                        class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300 transition" 
                        placeholder="Email">
                </div>
                
                <div>
                    <input type="password" id="password" required
                        class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300 transition" 
                        placeholder="kata Sandi">
                </div>

                <div id="wrapper-confirm-password" class="hidden">
                    <input type="password" id="confirm-password"
                        class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300 transition" 
                        placeholder="Konfirmasi Kata Sandi">
                </div>

                <div class="pt-2">
                    <button type="submit" id="btn-primary"
                        class="w-full py-4 bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-800 font-semibold rounded-full text-base tracking-wide shadow-sm transition duration-300">
                        Masuk
                    </button>
                </div>
            </form>

            <div class="text-center text-xs font-medium text-slate-700 pt-1">
                <span id="text-toggle-info">Belum punya akun?</span> 
                <button type="button" id="btn-secondary" class="text-pink-500 font-bold hover:underline ml-1">
                    Daftar di sini
                </button>
            </div>

            <div id="google-container" class="pt-2 w-full flex flex-col items-center space-y-3">
                <span class="text-[10px] text-slate-400 font-bold tracking-wider">ATAU MASUK DENGAN</span>
                <button id="btn-google" class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md hover:scale-105 transition transform duration-200 border border-slate-100">
                    <svg class="w-6 h-6" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                </button>
            </div>

        </div>

        <div id="main-screen" class="w-full space-y-6 hidden flex-col justify-between flex-grow">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                <div>
                    <p class="text-[10px] text-slate-400 font-bold tracking-wider uppercase">Nama Pengguna</p>
                    <h2 id="user-display-name" class="text-lg font-bold text-slate-800">Memuat...</h2>
                    <p id="user-email" class="text-[11px] text-slate-400"></p>
                </div>
                <button id="btn-logout" class="text-red-400 hover:text-red-600 p-2 text-xs font-bold transition">
                    Keluar
                </button>
            </div>

            <div class="bg-gradient-to-r from-pink-300 to-rose-300 rounded-[24px] p-5 text-slate-800 shadow-sm">
                <p class="text-[10px] font-bold tracking-wider uppercase opacity-70">Total Saldo Saat Ini</p>
                <h3 id="balance-display" class="text-2xl font-bold mt-1">Rp 0</h3>
            </div>

            <div class="space-y-4 bg-slate-50/60 p-4 rounded-[24px] border border-pink-50">
                <h4 class="text-xs font-bold text-slate-600 text-center uppercase tracking-wider">Tambah Catatan</h4>
                
                <div>
                    <input type="number" id="transaction-amount" placeholder="Jumlah (Rp). Contoh: 50000"
                        class="w-full px-4 py-3 rounded-full border border-slate-200 text-sm text-center focus:outline-none focus:border-pink-300 bg-white">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <label class="border border-slate-100 rounded-full p-2.5 flex items-center justify-center gap-2 cursor-pointer transition bg-white text-xs font-medium text-slate-600" id="label-income">
                        <input type="radio" name="transaction-type" value="income" checked class="text-pink-400 focus:ring-0">
                        Pemasukan
                    </label>
                    <label class="border border-slate-100 rounded-full p-2.5 flex items-center justify-center gap-2 cursor-pointer transition bg-white text-xs font-medium text-slate-600" id="label-expense">
                        <input type="radio" name="transaction-type" value="expense" class="text-pink-400 focus:ring-0">
                        Pengeluaran
                    </label>
                </div>

                <button id="btn-save-transaction"
                    class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 rounded-full text-sm tracking-wide transition">
                    Simpan Transaksi
                </button>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
