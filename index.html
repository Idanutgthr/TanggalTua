<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanggalTua - Masuk atau Daftar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fef08a 0%, #fbcfe8 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-[40px] shadow-xl p-8 max-w-sm w-full min-h-[750px] flex flex-col items-center justify-between border border-pink-100">
        
        <div class="w-full flex flex-col items-center flex-grow justify-center space-y-6">
            <div class="w-40 h-40 rounded-full bg-[#fbcfe8] bg-opacity-60 flex items-center justify-center overflow-hidden relative mb-2">
                <i class="fa-solid fa-user text-6xl text-slate-700"></i>
            </div>

            <div class="text-center space-y-2">
                <h2 id="auth-title" class="text-2xl font-semibold text-slate-800 leading-tight">
                    Selamat Datang di<br><span class="font-bold">Tanggal Tua</span>
                </h2>
                <p id="auth-subtitle" class="text-xs text-slate-500 font-medium max-w-[250px] mx-auto leading-relaxed">
                    kelola keuangan dengan mudah dan lebih hemat
                </p>
            </div>

            <form id="auth-form" class="w-full space-y-4 pt-2">
                <div id="wrapper-name" class="hidden relative">
                    <input type="text" id="reg-name" class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Nama Lengkap">
                </div>
                <div>
                    <input type="email" id="email" required class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Email">
                </div>
                <div>
                    <input type="password" id="password" required class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="kata Sandi">
                </div>
                <div id="wrapper-confirm-password" class="hidden">
                    <input type="password" id="confirm-password" class="w-full px-6 py-3 bg-[#fbcfe8] bg-opacity-60 text-slate-700 placeholder-slate-600 text-center rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="Konfirmasi Kata Sandi">
                </div>
                <div class="pt-2">
                    <button type="submit" id="btn-primary" class="w-full py-4 bg-[#fbcfe8] hover:bg-[#f9a8d4] text-slate-800 font-semibold rounded-full text-base shadow-sm transition">Masuk</button>
                </div>
            </form>

            <div class="text-center text-xs font-medium text-slate-700 pt-1">
                <span id="text-toggle-info">Belum punya akun?</span> 
                <button type="button" id="btn-secondary" class="text-pink-500 font-bold hover:underline ml-1">Daftar di sini</button>
            </div>

            <div class="pt-2 w-full flex flex-col items-center space-y-3">
                <span class="text-[10px] text-slate-400 font-bold tracking-wider">ATAU MASUK DENGAN</span>
                <button id="btn-google" class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-md border border-slate-100 hover:scale-105 transition">
                    <i class="fa-brands fa-google text-red-500 text-xl"></i>
                </button>
            </div>
        </div>

    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
